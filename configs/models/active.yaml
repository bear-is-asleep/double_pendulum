name: active_ann
model_type: mlp

output_dim: 6
hidden_width: 128
hidden_depth: 3
activation: tanh

lr: 0.001
batch_size: 256
subsample_stride_k: 4
loss_weight_theta: 1.0
loss_weight_omega: 0.25
seed: 0
max_epochs: 200
early_stop_patience: 20
val_fraction: 0.1
stage_pass_mse: 0.01

# QbC: ensemble std; mix with uniform (not pure high-var)
n_ensemble: 2
# Mix: (1-lambda)*uniform + lambda*uncertainty; lambda ramps with epoch
lambda_start: 0.1
lambda_end: 0.8
# Uncertainty = mean ensemble std over t of the 6 heads
