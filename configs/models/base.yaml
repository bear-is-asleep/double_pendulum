# Shared ANN + train defaults. Strategy YAMLs overlay these keys.
# ``train.model: baseline`` loads this file only (no separate baseline.yaml).

name: baseline_ann
model_type: mlp
strategy: baseline

# Inputs: (t, theta10, theta20, omega10, omega20, m1, m2, g)
input_dim: 8
# Heads: sin/cos theta1, sin/cos theta2, omega1, omega2
output_dim: 6
# int = same width every hidden layer; list length must match hidden_depth
hidden_width: [128, 64, 32]
hidden_depth: 3
activation: tanh
# Hidden activation dropout during train; 0 disables (no extra modules, old ckpts compatible)
dropout: 0.2


lr: 0.001
batch_size: 256
subsample_stride_k: 4
loss_weight_theta: 1.0
loss_weight_omega: 1.0
seed: 67
max_epochs: 100

stage_pass_mse: 1e-9
early_stop_patience: 10

# Active overrides n_ensemble in active.yaml
n_ensemble: 1

# Baseline only: proportional = mix by train row counts; equal = sample each stage equally.
baseline_stage_mix: equal
