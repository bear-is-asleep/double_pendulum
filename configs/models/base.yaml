# Shared ANN + train defaults. Strategy YAMLs overlay these keys.

model_type: mlp
strategy: baseline

# Inputs: (t, theta10, theta20, omega10, omega20, m1, m2, g)
input_dim: 8
# Heads: sin/cos theta1, sin/cos theta2, omega1, omega2
output_dim: 6
# int = same width every hidden layer; list length must match hidden_depth
hidden_width: [128, 64]
hidden_depth: 2
activation: tanh


lr: 0.001
batch_size: 256
subsample_stride_k: 4
loss_weight_theta: 1.0
loss_weight_omega: 0.25
seed: 0
max_epochs: 100

stage_pass_mse: 1e-9
early_stop_patience: 20

# Active overrides n_ensemble in active.yaml
n_ensemble: 1
