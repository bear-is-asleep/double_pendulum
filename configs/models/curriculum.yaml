name: curriculum_ann
strategy: curriculum

# Val-delta adaptive inlet (single loop; no segments).
mix_inlet_gain: 1.4 # How quickly to add the new stage to the mix
mix_inlet_max_chunk: 0.1 # Maximum chunk size to add to the mix
mix_min_val_delta: 1.0e-3 # Minimum value delta to add to the mix
mix_decay_lambda: 1.0 # 
mix_unlock_fraction: 0.15 # 

passed_stage_min_fraction: 0.05

# Full epochs at current active_max before active_max_stage may increase (0 = off).
mix_min_epochs_per_stage: 5

# Flat wval: force inlet after patience epochs (chunk not capped by mix_inlet_max_chunk).
mix_stagnation_wval_band: 1.0e-2
mix_stagnation_patience: 3
mix_stagnation_chunk: 0.07

# Early stop (global early_stop_patience) counts only after mix matches terminal target.
mix_inlet_terminal_frac_tol: 0.02
