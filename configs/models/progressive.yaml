name: progressive_ann
model_type: mlp

# Grow depth only; width stays at locked baseline hidden_width
output_dim: 6
hidden_width: 128
hidden_depth: 3
depth_start: 1
# Epoch fractions in [0,1] when depth increases toward hidden_depth
# Placeholder schedule; tune later
depth_grow_fracs: [0.33, 0.66]
activation: tanh

lr: 0.001
batch_size: 256
subsample_stride_k: 4
loss_weight_theta: 1.0
loss_weight_omega: 0.25
seed: 0
max_epochs: 200
early_stop_patience: 20
val_fraction: 0.1
stage_pass_mse: 0.01

n_ensemble: 1
