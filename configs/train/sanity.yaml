# Fast CI: tiny pools + short train (mirror configs/data/small.yaml intent).

data_root: data/baseline_small
runs_root: runs/baseline_small
run_id: baseline_w32_d1_k2
stages: [0, 1]

train:
  model: baseline
  device: cpu
  max_epochs: 2
  hidden_width: 32
  hidden_depth: 1
  subsample_stride_k: 2
  batch_size: 32
  stage_pass_mse: 1.0e9
