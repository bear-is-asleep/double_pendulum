[project]
name = "double-pendulum"
version = "0.1.0"
description = "Interactive double pendulum simulation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "nicegui>=2.0",
  "PyYAML>=6.0",
  "torch>=2.0",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["double_pendulum*"]
